name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # https://github.com/actions/checkout/releases
      - uses: actions/setup-node@v4 # https://github.com/actions/setup-node/releases
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # https://github.com/actions/checkout/releases
        with:
          fetch-depth: 0
      - name: Installer gitleaks 8.30.1
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      - run: gitleaks git -v --no-banner --redact .

  revue-ia:
    if: github.event_name == 'pull_request'
    needs: [qualite, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Vérifier le secret Copilot
        id: verifier-secret
        env:
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -n "$COPILOT_PAT" ]; then
            echo "secret-present=true" >> "$GITHUB_OUTPUT"
          else
            echo "revue IA sautée"
            echo "secret-present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.verifier-secret.outputs.secret-present == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.verifier-secret.outputs.secret-present == 'true'
        with:
          node-version: 24
      - name: Installer Copilot CLI
        if: steps.verifier-secret.outputs.secret-present == 'true'
        run: npm install -g @github/copilot
      - name: Préparer le diff de la pull request
        if: steps.verifier-secret.outputs.secret-present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)package-lock.json' > pr.diff
      - name: Relire le diff
        if: steps.verifier-secret.outputs.secret-present == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: copilot -p "Relis la pull request dont le diff est dans pr.diff, selon ta consigne." --agent relecteur-pr -s --no-ask-user --allow-all-tools --deny-tool=write --deny-tool=shell --max-ai-credits 30 > revue.md
      - name: Publier la revue
        if: steps.verifier-secret.outputs.secret-present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file revue.md